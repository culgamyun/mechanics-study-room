<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title description"><title id="title">초안 시각자료 자리 표시</title><desc id="description">작성 예정 시각자료의 자리 표시입니다. 기술적 형상 또는 작동 원리를 나타내지 않습니다.</desc><rect width="720" height="420" rx="24" fill="#f0f3ec"/><rect x="250" y="95" width="220" height="160" rx="18" fill="none" stroke="#759381" stroke-width="2" stroke-dasharray="8 8"/><path d="M310 186h100M360 136v100" stroke="#759381" stroke-width="2"/><text x="360" y="315" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#396958">시각자료 준비 중</text><text x="360" y="351" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#61766a">검토 전 · 개념 도해가 아닙니다</text></svg>
